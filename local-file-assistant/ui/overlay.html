<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; media-src blob:; connect-src 'self' ws://localhost:5173 http://127.0.0.1:*">
<title>Lumi AI overlay</title>
</head>
<body class="overlay">
  <!-- A slim see-through strip. It grows downward only while it has results or an answer to show. -->
  <div id="panel" role="dialog" aria-label="Find, ask or attach your files">
    <div class="overlay-input ov-strip">
      <div class="mark-overlay" id="mascot-slot" aria-hidden="true"></div>
      <input id="query" type="text" autocomplete="off" spellcheck="false" aria-label="Find, ask or attach" role="combobox" aria-autocomplete="list" aria-controls="overlay-body" aria-expanded="false">
      <div class="ov-seg" role="tablist" aria-label="What to do">
        <button type="button" class="tab" role="tab" data-mode="search" aria-selected="true">Find</button>
        <button type="button" class="tab" role="tab" data-mode="ask" aria-selected="false">Ask</button>
        <button type="button" class="tab" role="tab" data-mode="attach" aria-selected="false">Attach</button>
      </div>
      <button type="button" id="pin" class="ov-icon" aria-pressed="false" aria-label="Keep open" title="Keep open when you click elsewhere"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3z"/><line x1="12" y1="13" x2="12" y2="20"/></svg></button>
    </div>
    <div id="context-chip" class="context-chip" hidden></div>
    <div id="overlay-body" aria-live="polite"></div>
    <div id="overlay-footer" class="overlay-footer">
      <span class="overlay-status"><span class="status-dot"></span><span id="overlay-status" role="status" aria-live="polite">Ready</span></span>
      <span id="overlay-keys">↑↓ choose · ↵ open · Tab switch · Esc close</span>
    </div>
  </div>
  <script type="module" src="/src/overlay.js"></script>
</body>
</html>
